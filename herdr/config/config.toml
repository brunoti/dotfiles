onboarding = false

[theme]
name = "tokyo-night"

[terminal]
default_shell = "/bin/zsh"
shell_mode = "auto"
new_cwd = "follow"

[keys]
prefix = "ctrl+a"
help = "prefix+?"
detach = "prefix+q"
reload_config = "prefix+shift+r"
new_tab = "prefix+c"
rename_tab = "prefix+shift+t"
previous_tab = "alt+u"
next_tab = "alt+i"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_vertical = "prefix+v"
split_horizontal = "prefix+minus"
close_pane = "prefix+x"
toggle_sidebar = "prefix+b"
zoom = "prefix+z"

# Herdr supports custom commands; these approximate your tmux popups/workflows.
[[keys.command]]
key = "prefix+alt+g"
type = "pane"
command = "lazygit"

[ui]
mouse_capture = true
prompt_new_tab_name = true
