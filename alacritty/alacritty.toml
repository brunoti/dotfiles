[terminal]
shell = "nu"

[font]
size = 14

[font.normal]
family = "Iosevka Nerd Font Mono"
style = "Light"

[font.offset]
y = 0
x = 0

[font.glyph_offset]
y = 0
x = 0

[window.padding]
x = 15
y = 15

[env]
TERM = "xterm-256color"

[window]
option_as_alt = "Both"
dynamic_padding = true
decorations = "Buttonless"

[[hints.enabled]]
command = "open" # On macOS
hyperlinks = true
post_processing = true
persist = false
mouse.enabled = true
binding = { key = "O", mods = "Control|Shift" }

[general]
import = [
	"~/.config/alacritty/themes/themes/tokyo_night.toml",
]
